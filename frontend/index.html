<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FundPath</title>
  <link rel="stylesheet" href="style.css?v=7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="split-flap.css" />
</head>
<body>
<!-- WebGL Aurora Background -->
<div id="aurora-bg" style="position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;"></div>
<script src="aurora.js?v=6"></script>

<!-- SPLIT FLAP INTRO -->
<div id="split-flap-wrapper" class="split-flap-wrapper">
  <div id="split-flap" class="split-flap-text"></div>
</div>

<!-- ═══════════════════════════════════════════════════════
     ONBOARDING VIEW
═══════════════════════════════════════════════════════ -->
<div id="view-onboarding">
  <div class="ob-header">
    <div class="ob-header-inner">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
        FundPath
      </div>
      <div class="ob-steps" id="ob-step-bar"></div>
    </div>
  </div>
  <div class="ob-body" id="ob-content"></div>
</div>

<!-- ═══════════════════════════════════════════════════════
     DASHBOARD VIEW
═══════════════════════════════════════════════════════ -->
<div id="view-dashboard" class="hidden">
  <div class="dash-header">
    <div class="dash-header-inner">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
        FundPath
      </div>
      <div id="pool-badge" class="pool-badge hidden">💰 Pool: ₹0</div>
      <div class="ml-auto" style="display:flex;gap:10px;align-items:center;">
        <button class="btn btn-outline btn-sm" onclick="showDecisionLog()" title="Decision Log">📋</button>
        <button class="avatar-btn" id="avatar-btn" onclick="openSettings()" title="Account & Settings">
          <span id="avatar-initials">?</span>
        </button>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-bar-inner">
      <button class="tab-btn active" id="tab-btn-scholarships" onclick="switchTab('scholarships')">🎓 Scholarships</button>
      <button class="tab-btn" id="tab-btn-investing" onclick="switchTab('investing')">📈 Investing</button>
    </div>
  </div>

  <div class="dash-main">
    <div id="tab-scholarships" class="tab-pane"></div>
    <div id="tab-investing" class="tab-pane hidden"></div>
    
    <div class="ai-disclaimer">
      AI can make mistakes. Please check the information yourself before making decisions.
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════
     MODAL — Investment Confirmation
═══════════════════════════════════════════════════════ -->
<div id="modal-invest-confirm" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:480px;">
    <div class="modal-header">
      <h2>📈 Confirm Investment Plan</h2>
      <button class="modal-close" onclick="closeModal('modal-invest-confirm')">✕</button>
    </div>
    <div class="modal-body" id="modal-invest-confirm-body"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-invest-confirm')">Cancel</button>
      <button class="btn btn-success" id="btn-invest-confirm-ok" onclick="confirmAndInvest()">✓ Confirm &amp; Invest Now →</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════
     MODAL — Decision Log
═══════════════════════════════════════════════════════ -->
<div id="modal-log" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:720px;">
    <div class="modal-header">
      <h2>📋 Decision Log Agent Suggestions vs. Family Choices</h2>
      <button class="modal-close" onclick="closeModal('modal-log')">✕</button>
    </div>
    <div class="modal-body" id="modal-log-body"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════
     MODAL — Pool Edit
═══════════════════════════════════════════════════════ -->
<div id="modal-pool-edit" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Edit Investment Pool</h2>
      <button class="modal-close" onclick="closeModal('modal-pool-edit')">✕</button>
    </div>
    <div class="modal-body" id="modal-pool-body"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-pool-edit')">Cancel</button>
      <button class="btn btn-primary" id="pool-edit-confirm-btn" onclick="submitPoolEdit()">Confirm Edit</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════
     MODAL — DigiLocker
═══════════════════════════════════════════════════════ -->
<div id="modal-digi" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:400px;">
    <div class="modal-body" id="modal-digi-body" style="text-align:center;padding:32px;"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════
     SETTINGS DRAWER (right slide-in)
     ⚠️  CONSTRAINT: This panel is view/edit-only.
         It may NOT call allocation, filter_investments,
         recommend_investment, or pool-edit tools.
         No path through this panel bypasses a confirmation gate.
═══════════════════════════════════════════════════════ -->
<div id="settings-overlay" class="settings-overlay hidden" onclick="closeSettingsOverlay(event)">
  <aside class="settings-panel" id="settings-panel">
    <div class="sp-header">
      <div>
        <div class="sp-avatar-lg" id="sp-avatar-lg">?</div>
        <div class="sp-user-name" id="sp-user-name">Loading…</div>
        <div class="sp-user-sub" id="sp-user-sub"></div>
      </div>
      <button class="sp-close" onclick="closeSettings()">✕</button>
    </div>
    <div class="sp-body" id="sp-body"></div>
  </aside>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="split-flap.js?v=4"></script>
<script src="app.js?v=7"></script>
</body>
</html>
